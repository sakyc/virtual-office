<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dfe7f1" />
  <title>Kantor 3D | Karyora</title>
  <link rel="icon" type="image/svg+xml" href="/branding/karyora-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="stage"><canvas id="scene" aria-label="Kantor AI 3D"></canvas></div>
  <div id="tags" aria-hidden="true"></div>

  <header id="topbar">
    <div class="brand">
      <img src="/branding/karyora-mark.svg" width="28" height="28" alt="" />
      <div><strong>Karyora</strong><small>Kantor AI</small></div>
    </div>
    <button id="btn-board" class="board-btn" type="button" aria-label="Buka board kerja">Board <span id="board-count" hidden></span></button>
    <nav id="chips" aria-label="Divisi"></nav>
  </header>

  <div id="banner" hidden></div>
  <div id="hint">Klik karakter untuk ngobrol &nbsp;·&nbsp; geser untuk pindah &nbsp;·&nbsp; scroll untuk zoom</div>

  <aside id="panel" aria-label="Chat" aria-hidden="true" data-tab="chat">
    <div class="panel-head">
      <div id="avatar" class="avatar"></div>
      <div class="who">
        <strong id="who-name"></strong>
        <span id="who-role"></span>
      </div>
      <button id="btn-reset" class="icon-btn" title="Mulai chat baru" aria-label="Mulai chat baru">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button id="btn-close" class="icon-btn" title="Tutup" aria-label="Tutup chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="mates" class="mates"></div>
    <div id="tabs" class="tabs">
      <button type="button" data-tab="chat" aria-pressed="true">Chat</button>
      <button type="button" data-tab="jobs" aria-pressed="false">Perintah</button>
    </div>
    <div id="jobs" class="jobs"></div>
    <div id="messages" class="messages" role="log" aria-live="polite"></div>
    <div id="quick" class="quick"></div>
    <section id="conversation-tools" class="conversation-tools" aria-label="Kontrol percakapan" hidden>
      <button id="chat-new" type="button">+ Chat baru</button>
      <details id="chat-history-drawer">
        <summary>Riwayat chat</summary>
        <div class="chat-history-content">
          <label>Percakapan<select id="chat-list" aria-label="Pilih percakapan"></select></label>
          <button id="chat-more" type="button" hidden>Riwayat lainnya</button>
          <form id="chat-title-form"><input id="chat-title" aria-label="Judul percakapan" maxlength="100" placeholder="Judul percakapan" required><button type="submit">Simpan judul</button><button id="chat-delete" type="button" title="Hapus chat dan seluruh pesannya secara permanen">Hapus chat</button></form>
          <button id="chat-older" type="button" hidden>Pesan sebelumnya</button>
        </div>
      </details>
    </section>
    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Tulis pesan…" maxlength="4000" enterkeyhint="send"></textarea>
      <div class="composer-actions">
        <div id="chat-model-controls" class="chat-model-controls" hidden>
          <label id="chat-model-field"><span class="sr-only">Model AI</span><select id="chat-model" aria-label="Pilih model AI" aria-describedby="chat-model-info"></select></label>
          <details class="chat-model-help"><summary aria-label="Informasi penggunaan model">ⓘ</summary><p id="chat-model-info" class="chat-model-info"></p></details>
        </div>
      <button id="btn-send" type="submit" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      </div>
    </form>
    <div class="panel-foot">AI bisa keliru. Semua jawaban berupa draft, cek dulu sebelum dikirim ke klien.</div>
  </aside>

  <div id="gate" class="gate" hidden>
    <form id="gate-form" class="gate-card">
      <h2>Masukkan kode akses</h2>
      <p>Kantor ini dibatasi supaya biaya API tetap terkontrol.</p>
      <input id="gate-input" type="password" placeholder="Kode akses" autocomplete="current-password" />
      <p id="gate-error" class="gate-error" hidden></p>
      <button type="submit">Masuk</button>
    </form>
  </div>

  <div id="loading" class="loading"><div class="spinner"></div><span>Menyiapkan kantor…</span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
