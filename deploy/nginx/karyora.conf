# Bootstrap HTTP configuration for Ubuntu/Debian Nginx (not a panel-managed VPS).
# Install HTTPS with Certbot before signing in or accepting user traffic.
# Replace /srv/karyora if your checkout uses a different path.
server {
    listen 80;
    server_name karyora.vetencode.com;
    root /srv/karyora/dist;
    index index.html;

    # Keep existing relative CTA links working without sharing login cookies.
    location ~ ^/(login|register|join|demo|scheduled-demo|onboarding|dashboard|admin|app|auth)(/|$) {
        return 302 https://app.karyora.vetencode.com$request_uri;
    }
    location = /office.html {
        return 302 https://app.karyora.vetencode.com/dashboard/office;
    }

    # Only the public catalog is exposed on the marketing hostname.
    location = /api/plans {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
    location /api/ { return 404; }
    location = /api { return 404; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri =404; }
}

server {
    listen 80;
    server_name app.karyora.vetencode.com;
    client_max_body_size 1m;

    location = / { return 302 /login; }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One directly connected proxy; discard untrusted client forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        # AI replies use SSE: don't buffer them or close long idle generations early.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
