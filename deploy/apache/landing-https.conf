# cPanel SSL vhost include; never edit generated httpd.conf directly.
DocumentRoot "/home/vetencode/apps/karyora/dist"
<Directory "/home/vetencode/apps/karyora/dist">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

RewriteEngine On
RewriteRule ^/?(login|register|join|onboarding|dashboard|admin|app|auth)(/.*)?$ https://app.karyora.vetencode.com%{REQUEST_URI} [R=302,L,NE]
RewriteRule ^/?office\.html$ https://app.karyora.vetencode.com/dashboard/office [R=302,L]
RewriteCond %{REQUEST_URI} !^/api/plans$
RewriteRule ^/?api(/|$) - [R=404,L]

ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders Off
ProxyPassMatch ^/api/plans$ http://127.0.0.1:3101/api/plans connectiontimeout=5 timeout=30
ProxyPassReverse /api/plans http://127.0.0.1:3101/api/plans
<Location "/api/plans">
    RequestHeader unset Cookie
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    Header always unset Set-Cookie
    <LimitExcept GET>
        Require all denied
    </LimitExcept>
</Location>
<FilesMatch "^(index\.html)$">
    Header set Cache-Control "no-cache"
</FilesMatch>
