# cPanel SSL vhost include. Backend is loopback-only, one proxy hop.
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders Off
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
RewriteEngine On
RewriteRule ^/?$ /login [R=302,L]
ProxyPass / http://127.0.0.1:3101/ connectiontimeout=5 timeout=300
ProxyPassReverse / http://127.0.0.1:3101/
